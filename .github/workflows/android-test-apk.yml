name: Build Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Diagnose Expo native modules
        run: |
          npx expo-modules-autolinking search --json > /tmp/expo-modules.json
          node -e "const m=require('/tmp/expo-modules.json'); for (const [name,value] of Object.entries(m)) console.log(name, JSON.stringify(value.config));"

      - name: Build standalone release APK with embedded JavaScript
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: celebritys-chat-standalone-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
